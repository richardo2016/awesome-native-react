name: audit

on:
  schedule:
    # every two days, 16:20 UTC (00:20 Beijing)
    - cron: "20 16 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audit
        run: node scripts/generate.mjs all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/entries.json README.md README.zh-CN.md; then
            echo "No audit changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json README.md README.zh-CN.md
          git commit -m "chore(audit): refresh objective data ($(date -u +%Y-%m-%d))"
          git push
